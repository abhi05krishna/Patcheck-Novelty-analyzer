services:
  ml-service:
    build:
      context: ./patcheck-ml-service
    ports:
      - "8000:8000"
    env_file:
      - ./patcheck-ml-service/.env
    

  server:
    build:
      context: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
    volumes:
      - server-uploads:/app/uploads
    depends_on:
      - ml-service

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  
  server-uploads: